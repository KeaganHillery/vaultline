{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="eyebrow">NEW ITEM</div><h1>Add to Vaultline</h1><form class="card form" method="post"><label>Name<input name="name" placeholder="e.g. Family car" required></label><label>Category<input name="category" list="categories" placeholder="e.g. Vehicle" required><datalist id="categories"><option>Vehicle</option><option>Property</option><option>Device</option><option>Document</option><option>Insurance</option><option>Warranty</option><option>Subscription</option><option>Contact</option><option>Other</option></datalist></label><label>Description<textarea name="description" placeholder="What is this and why does it matter?"></textarea></label><div class="two"><label>Location<input name="location" placeholder="Garage"></label><label>Owner<input name="owner" placeholder="Keagan"></label></div><label>Expiry / renewal date<input type="date" name="expiry_date"></label><button>Create item</button></form></div>{% endblock %}
