<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaultline</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('dashboard') }}">VAULTLINE</a>{% if session.user %}<div class="navlinks"><a href="{{ url_for('items') }}">Vault</a><a href="{{ url_for('new_item') }}">+ Add</a><a href="{{ url_for('export') }}">Export</a><a href="{{ url_for('admin') }}">Admin</a><a href="{{ url_for('logout') }}">Logout</a></div>{% endif %}</nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
