{% extends 'base.html' %}{% block content %}<div class="top"><div><div class="eyebrow">ADMINISTRATION</div><h1>Users</h1><p class="muted">Manage access to this Vaultline instance.</p></div></div><section><div class="card"><h2>Create user</h2><form method="post" action="{{url_for('admin_new_user')}}"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label><button>Create user</button></form></div></section><section><div class="list">{% for u in users %}<div class="row"><span><strong>{{u.username}}</strong><small>{{u.role}} · {% if u.active %}Active{% else %}Disabled{% endif %}</small></span>{% if u.username != session.user %}<form method="post" action="{{url_for('admin_toggle_user',id=u.id)}}"><button type="submit">{{'Disable' if u.active else 'Enable'}}</button></form>{% endif %}</div>{% endfor %}</div></section>{% endblock %}
