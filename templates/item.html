{% extends 'base.html' %}{% block content %}<div class="top"><div><span class="tag">{{item.category}}</span><h1>{{item.name}}</h1><p class="muted">Created {{item.created_at[:10]}}</p></div><form method="post" action="{{url_for('delete_item',id=item.id)}}" onsubmit="return confirm('Delete this item and its documents?')"><button class="danger">Delete</button></form></div><div class="two-col"><section class="card"><h2>Details</h2><form class="form" method="post"><label>Name<input name="name" value="{{item.name}}" required></label><label>Category<input name="category" value="{{item.category}}" required></label><label>Description<textarea name="description">{{item.description}}</textarea></label><div class="two"><label>Location<input name="location" value="{{item.location}}"></label><label>Owner<input name="owner" value="{{item.owner}}"></label></div><label>Expiry / renewal date<input type="date" name="expiry_date" value="{{item.expiry_date}}"></label><button>Save changes</button></form></section><section><div class="card"><h2>Documents</h2><form class="upload" method="post" enctype="multipart/form-data" action="{{url_for('upload',id=item.id)}}"><input type="file" name="file" required><button>Upload</button></form>{% for d in docs %}<div class="doc"><a href="{{url_for('download',id=d.id)}}">{{d.filename}}</a><form method="post" action="{{url_for('delete_doc',id=d.id)}}"><button class="icon" title="Delete">×</button></form></div>{% else %}<p class="muted">No documents attached.</p>{% endfor %}</div></section></div>{% endblock %}
